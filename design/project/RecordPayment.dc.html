<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Record payment</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4A2EE6}a:hover{color:#3D27B8}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #5E6170; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0F172A; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden">
  <a href="Member.dc.html" aria-label="Close" style="flex: 1"></a>
  <section role="dialog" aria-modal="true" aria-labelledby="rp-title" style="background: #FFFFFF; border-radius: 22px 22px 0 0; padding: 10px 20px 24px; display: flex; flex-direction: column; gap: 18px">
    <span style="align-self: center; width: 40px; height: 5px; border-radius: 99px; background: #DADAE3"></span>
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div>
        <h1 id="rp-title" style="margin: 0; font-size: 20px; font-weight: 800">Payment from Priya</h1>
        <div style="font-size: 13px; color: #5B6475">Owes ₹6,000 · Oct and Nov</div>
      </div>
      <a href="Member.dc.html" aria-label="Close" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #5B6475">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
      </a>
    </div>

    <div>
      <label for="rp-amt" style="font-size: 13px; font-weight: 700; color: #3A4252">Amount received</label>
      <div style="display: flex; align-items: center; gap: 6px; margin-top: 6px; height: 60px; border: 2px solid #5B3DF5; border-radius: 14px; padding: 0 16px">
        <span style="font-size: 28px; font-weight: 800; color: #5B6475">₹</span>
        <input id="rp-amt" inputmode="numeric" value="{{amountText}}" readonly style="border: 0; outline: 0; font: inherit; font-size: 28px; font-weight: 800; width: 100%; color: #0F172A; background: transparent">
      </div>
      <div style="display: flex; gap: 8px; margin-top: 10px">
        <sc-for list="{{amounts}}" as="a" hint-placeholder-count="3">
          <sc-if value="{{a.sel}}" hint-placeholder-val="{{ false }}">
            <button type="button" aria-pressed="true" onClick="{{a.pick}}" style="height: 38px; padding: 0 14px; border-radius: 99px; font-size: 13px; font-weight: 700; border: 1px solid #5B3DF5; background: #F1EEFF; color: #3D27B8">{{a.label}}</button>
          </sc-if>
          <sc-if value="{{a.unsel}}" hint-placeholder-val="{{ true }}">
            <button type="button" aria-pressed="false" onClick="{{a.pick}}" style="height: 38px; padding: 0 14px; border-radius: 99px; font-size: 13px; font-weight: 700; border: 1px solid #E4E4EC; background: #FFFFFF; color: #0F172A">{{a.label}}</button>
          </sc-if>
        </sc-for>
      </div>
    </div>

    <fieldset style="border: 0; padding: 0; margin: 0">
      <legend style="font-size: 13px; font-weight: 700; color: #3A4252; padding: 0">Paid by</legend>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 6px">
        <sc-for list="{{modes}}" as="m" hint-placeholder-count="3">
          <sc-if value="{{m.sel}}" hint-placeholder-val="{{ false }}">
            <button type="button" aria-pressed="true" onClick="{{m.pick}}" style="height: 48px; border-radius: 12px; font-size: 14px; font-weight: 700; border: 2px solid #5B3DF5; background: #F1EEFF; color: #3D27B8">{{m.label}}</button>
          </sc-if>
          <sc-if value="{{m.unsel}}" hint-placeholder-val="{{ true }}">
            <button type="button" aria-pressed="false" onClick="{{m.pick}}" style="height: 48px; border-radius: 12px; font-size: 14px; font-weight: 700; border: 1px solid #E4E4EC; background: #FFFFFF; color: #0F172A">{{m.label}}</button>
          </sc-if>
        </sc-for>
      </div>
      <div style="font-size: 13px; color: #5B6475; margin-top: 8px">Today, 5 Nov · <a href="#" style="font-weight: 700; text-decoration: none">Change date</a></div>
    </fieldset>

    <div style="background: #F0FBF5; border: 1px solid #CDEFDD; border-radius: 14px; padding: 12px 14px">
      <label style="display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; font-weight: 700; color: #066B3F">
        Send receipt on WhatsApp
        <input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #066B3F">
      </label>
      <p style="margin: 8px 0 0; font-size: 13px; line-height: 1.45; color: #1F3B2D; white-space: pre-line">{{receipt}}</p>
    </div>

    <a href="Member.dc.html" style="height: 54px; border-radius: 14px; background: #5B3DF5; color: #FFFFFF; font-weight: 800; font-size: 16px; display: flex; align-items: center; justify-content: center; text-decoration: none">Save ₹{{amountText}} payment</a>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { amt: 6000, mode: 'UPI' }; }
  renderVals() {
    const fmt = (n) => n.toLocaleString('en-IN');
    const { amt, mode } = this.state;
    const amounts = [[6000, 'Full ₹6,000'], [3000, 'One month ₹3,000'], [1000, '₹1,000']].map(([v, label]) => ({
      label, sel: v === amt, unsel: v !== amt, pick: () => this.setState({ amt: v }),
    }));
    const modes = ['Cash', 'UPI', 'Bank'].map((m) => ({
      label: m, sel: m === mode, unsel: m !== mode, pick: () => this.setState({ mode: m }),
    }));
    const left = 6000 - amt;
    const receipt = 'Sharma Mess: received ₹' + fmt(amt) + ' by ' + mode + ' on 5 Nov.\n' +
      (left > 0 ? 'Still due: ₹' + fmt(left) + '.' : 'All clear, nothing due. Thank you!') +
      '\nYour statement: lsaas.in/s/••••';
    return { amountText: fmt(amt), amounts, modes, receipt };
  }
}
</script>
</body>
</html>
