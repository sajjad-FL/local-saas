<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings – mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:2px solid #5B3DF5;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #F4F6FA; font-family: Inter, system-ui, sans-serif; color: #0F172A">
  <div style="height: 100%; overflow-y: auto; box-sizing: border-box; padding: 18px 16px 24px; display: flex; flex-direction: column; gap: 12px">
    <header style="display: flex; align-items: center; gap: 12px">
      <span style="width: 48px; height: 48px; border-radius: 14px; background: linear-gradient(135deg, #5B3DF5, #8B5CF6); color: #FFFFFF; display: grid; place-items: center; font-weight: 700">SA</span>
      <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 12.5px; color: #64748B">Sajjad Alam · Owner</span><b style="font-size: 22px; letter-spacing: -0.02em">Settings</b></span>
      <button type="button" style="height: 36px; padding: 0 12px; border: 1px solid #E2E5EC; border-radius: 10px; background: #FFFFFF; font-weight: 600; font-size: 13px">Edit</button>
    </header>

    <!-- health chips, swipe sideways -->
    <div style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 0 16px">
      <span style="flex: none; height: 34px; padding: 0 12px; border-radius: 99px; background: #ECFDF3; color: #066B3F; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center">✓ UPI working</span>
      <span style="flex: none; height: 34px; padding: 0 12px; border-radius: 99px; background: #FFF6E5; color: #92400E; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center">! Reminders not connected</span>
      <span style="flex: none; height: 34px; padding: 0 12px; border-radius: 99px; background: #EEF4FF; color: #1D4ED8; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center">Attendance on</span>
    </div>

    <section style="padding: 16px; border-radius: 16px; background: linear-gradient(135deg, #1E1B4B 0%, #3D27B8 60%, #5B3DF5 100%); color: #FFFFFF; display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 11.5px; opacity: .75; letter-spacing: .06em; text-transform: uppercase; font-weight: 600">Members pay you at</span>
      <b style="font-family: ui-monospace, monospace; font-size: 19px">7002729745@ybl</b>
      <span style="display: flex; gap: 8px; margin-top: 6px"><button type="button" style="flex: 1; height: 38px; border: 0; border-radius: 10px; background: rgba(255,255,255,.16); color: #FFFFFF; font-weight: 600; font-size: 13px">Send ₹1 test</button><button type="button" style="flex: 1; height: 38px; border: 0; border-radius: 10px; background: #FFFFFF; color: #3D27B8; font-weight: 600; font-size: 13px">Change</button></span>
    </section>

    <section style="background: #FFFFFF; border: 1px solid #E7E9F0; border-radius: 16px; overflow: hidden">
      <div style="display: flex; align-items: center; gap: 12px; padding: 14px"><span style="flex: 1; display: flex; flex-direction: column"><b style="font-weight: 600; font-size: 14.5px">Auto WhatsApp reminders</b><span style="font-size: 12px; color: #92400E">Not connected — use Remind on Collect</span></span><span style="width: 44px; height: 26px; border-radius: 99px; background: #5B3DF5; position: relative"><i style="position: absolute; right: 3px; top: 3px; width: 20px; height: 20px; border-radius: 99px; background: #FFFFFF"></i></span></div>
      <div style="padding: 0 14px 14px; display: flex; flex-direction: column; gap: 8px"><span style="font-size: 12.5px; color: #64748B">Same member at most every</span>
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 3px; background: #F4F6FA; border-radius: 10px"><span style="height: 34px; border-radius: 8px; background: #FFFFFF; font-weight: 600; font-size: 13px; display: grid; place-items: center">3 days</span><span style="height: 34px; font-size: 13px; color: #475569; display: grid; place-items: center">5 days</span><span style="height: 34px; font-size: 13px; color: #475569; display: grid; place-items: center">7 days</span></div>
      </div>
    </section>

    <nav style="background: #FFFFFF; border: 1px solid #E7E9F0; border-radius: 16px; overflow: hidden">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
        <div style="display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-top: {{r.line}}">
          <span style="width: 32px; height: 32px; border-radius: 9px; background: {{r.bg}}; color: {{r.ink}}; display: grid; place-items: center; font-size: 14px">{{r.icon}}</span>
          <span style="flex: 1; display: flex; flex-direction: column"><b style="font-weight: 600; font-size: 14.5px">{{r.label}}</b><span style="font-size: 12px; color: #64748B">{{r.hint}}</span></span>
          <span style="color: #94A3B8">{{r.end}}</span>
        </div>
      </sc-for>
    </nav>
    <button type="button" style="height: 46px; border: 1px solid #E2E5EC; border-radius: 12px; background: #FFFFFF; font-weight: 600">Sign out</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const R = [
      { label: 'Attendance', hint: 'QR check-in at the door', icon: '✓', bg: '#EEF4FF', ink: '#1D4ED8', end: 'On' },
      { label: 'Password', hint: 'Change it any time', icon: '🔒', bg: '#ECFDF3', ink: '#066B3F', end: '›' },
      { label: 'Look', hint: 'Light or dark', icon: '☀', bg: '#FFF6E5', ink: '#92400E', end: 'Light ›' },
      { label: 'Download your data', hint: 'Backup, payments, fees, expenses', icon: '↓', bg: '#F1EEFF', ink: '#3D27B8', end: '›' },
      { label: 'Danger zone', hint: 'Clear data or delete outlet', icon: '!', bg: '#FEF1F0', ink: '#B42318', end: '›' },
    ];
    return { rows: R.map((r, i) => ({ ...r, line: i ? '1px solid #EEF0F5' : '0' })) };
  }
}
</script>
</body>
</html>
