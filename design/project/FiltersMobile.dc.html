<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Members filters – mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4A2EE6}a:hover{color:#3D27B8}
button,input{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid #5B3DF5;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F4F6FA; font-family: Inter, system-ui, sans-serif; color: #0F172A; display: flex; flex-direction: column">

  <header style="padding: 20px 16px 8px; display: flex; flex-direction: column; gap: 12px">
    <div>
      <h1 style="margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.02em">Members</h1>
      <p style="margin: 2px 0 0; font-size: 13px; color: #64748B">10 active · ₹10,000 to collect</p>
    </div>
    <label style="display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 14px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E7E9F0; color: #64748B">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search members</span>
      <input type="search" placeholder="Search name or phone" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 15px; color: #0F172A">
    </label>
    <div style="display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px">
      <button type="button" aria-haspopup="dialog" onClick="{{openStatus}}" style="height: 44px; padding: 0 12px 0 14px; border: 1.5px solid {{stBorder}}; border-radius: 12px; background: {{stBg}}; color: {{stInk}}; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; gap: 8px">
        <span style="display: flex; align-items: center; gap: 8px; min-width: 0"><span style="width: 8px; height: 8px; border-radius: 99px; background: {{stDot}}"></span><span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{stLabel}}</span></span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
      </button>
      <button type="button" aria-haspopup="dialog" onClick="{{openSort}}" aria-label="Sort: {{sortLabel}}" style="height: 44px; padding: 0 14px; border: 1px solid #E2E5EC; border-radius: 12px; background: #FFFFFF; color: #0F172A; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4"></path></svg>Sort
      </button>
    </div>
  </header>

  <ul style="list-style: none; margin: 0; padding: 4px 16px 24px; display: flex; flex-direction: column; gap: 10px; flex: 1; overflow: auto">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
      <li style="background: #FFFFFF; border: 1px solid #E7E9F0; border-radius: 14px; padding: 14px">
        <div style="display: flex; align-items: center; gap: 12px">
          <span style="width: 40px; height: 40px; border-radius: 99px; background: #F1EEFF; color: #3D27B8; display: grid; place-items: center; font-weight: 700; font-size: 13px">{{r.initials}}</span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><b style="font-weight: 600; font-size: 15px">{{r.name}}</b><span style="font-size: 12.5px; color: #64748B">{{r.plan}} · {{r.batch}}</span></span>
          <b style="font-size: 16px; color: {{r.balInk}}; font-variant-numeric: tabular-nums">{{r.balText}}</b>
        </div>
        <span style="display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; height: 26px; padding: 0 10px; border-radius: 99px; background: {{r.pillBg}}; color: {{r.pillInk}}; font-size: 12.5px; font-weight: 600"><span style="width: 6px; height: 6px; border-radius: 99px; background: currentColor"></span>{{r.statusText}}</span>
      </li>
    </sc-for>
    <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
      <li style="padding: 40px 8px; text-align: center; color: #64748B; font-size: 14px">No members here.</li>
    </sc-if>
  </ul>

  <sc-if value="{{sheetOpen}}" hint-placeholder-val="{{ true }}">
    <button type="button" aria-label="Close" onClick="{{close}}" style="position: absolute; inset: 0; z-index: 8; border: 0; padding: 0; background: rgba(15,23,42,.36); cursor: default"></button>
    <section role="dialog" aria-modal="true" aria-labelledby="fm-title" style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 9; max-height: 82%; background: #FFFFFF; border-radius: 22px 22px 0 0; box-shadow: 0 -12px 40px rgba(15,23,42,.2); display: flex; flex-direction: column">
      <span style="align-self: center; width: 40px; height: 5px; margin-top: 8px; border-radius: 99px; background: #DADDE5"></span>
      <h2 id="fm-title" style="margin: 0; padding: 12px 18px 10px; font-size: 17px; font-weight: 700">{{sheetTitle}}</h2>
      <div role="listbox" aria-labelledby="fm-title" style="flex: 1; overflow-y: auto; padding: 0 10px 20px">
        <sc-for list="{{sheetItems}}" as="it" hint-placeholder-count="8">
          <sc-if value="{{it.isHead}}" hint-placeholder-val="{{ false }}">
            <div style="padding: 12px 10px 4px; font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: #94A3B8">{{it.label}}</div>
          </sc-if>
          <sc-if value="{{it.isOpt}}" hint-placeholder-val="{{ true }}">
            <button type="button" role="option" aria-selected="{{it.onStr}}" onClick="{{it.pick}}" style="width: 100%; min-height: 48px; padding: 0 10px; border: 0; border-radius: 12px; background: {{it.bg}}; color: {{it.ink}}; font-size: 15px; font-weight: {{it.weight}}; display: flex; align-items: center; gap: 12px; text-align: left">
              <span style="width: 9px; height: 9px; border-radius: 99px; flex: none; background: {{it.dot}}"></span>
              <span style="flex: 1">{{it.label}}</span>
              <span style="min-width: 26px; height: 24px; padding: 0 8px; box-sizing: border-box; border-radius: 99px; background: {{it.countBg}}; color: {{it.countInk}}; font-size: 12.5px; font-weight: 600; display: grid; place-items: center">{{it.count}}</span>
            </button>
          </sc-if>
        </sc-for>
      </div>
    </section>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sheet: 'status', status: 'expired', sort: 'late' };
  }
  renderVals() {
    const rows0 = [
      { name: 'Rohit Kumar', plan: 'Monthly', batch: 'Evening 6–8', bal: 3000, late: 41, renew: -41, away: 12 },
      { name: 'Neha Singh', plan: 'Quarterly', batch: 'Ladies 10–12', bal: 4000, late: 19, renew: -19, away: 9 },
      { name: 'Sajjad Alam', plan: 'Monthly', batch: 'Morning 6–8', bal: 1500, late: 4, renew: -4, away: 2 },
      { name: 'Aman Gupta', plan: 'Monthly', batch: 'Evening 6–8', bal: 1500, late: 0, renew: 0, away: 0 },
      { name: 'Pooja Rao', plan: 'Monthly', batch: 'Ladies 10–12', bal: 0, late: 0, renew: 2, away: 11 },
      { name: 'Divya Menon', plan: 'Monthly', batch: 'Evening 6–8', bal: 0, late: 0, renew: 6, away: 4 },
      { name: 'Farhan Ali', plan: 'Monthly', batch: 'Evening 6–8', bal: 0, late: 0, renew: 21, away: 35 },
      { name: 'Vikram Shah', plan: 'Quarterly', batch: 'Morning 6–8', bal: 0, late: 0, renew: 52, away: 1 },
      { name: 'Meena Joshi', plan: 'Quarterly', batch: 'Ladies 10–12', bal: 0, late: 0, renew: 80, away: 3 },
      { name: 'Karan Mehta', plan: 'Monthly', batch: 'Morning 6–8', bal: 0, late: 0, renew: 18, away: null },
    ];
    const STATUS = [
      ['all', 'All members', '#94A3B8', () => true],
      ['h', 'Payment'],
      ['expired', 'Expired', '#DC2626', (r) => r.late > 0],
      ['due', 'Due members', '#EA580C', (r) => r.bal > 0],
      ['h', 'Expiring'],
      ['today', 'Expiring today', '#D97706', (r) => r.renew === 0],
      ['e3', 'Expiring in 1–3 days', '#D97706', (r) => r.renew >= 1 && r.renew <= 3],
      ['e7', 'Expiring in 4–7 days', '#CA8A04', (r) => r.renew >= 4 && r.renew <= 7],
      ['e30', 'Expiring in 8–30 days', '#65A30D', (r) => r.renew >= 8 && r.renew <= 30],
      ['h', 'Attendance'],
      ['away7', 'Not coming 7+ days', '#7C3AED', (r) => r.away !== null && r.away >= 7],
      ['never', 'Never came', '#7C3AED', (r) => r.away === null],
      ['h', 'Others'],
      ['clear', 'Paid up', '#16A34A', (r) => r.bal <= 0],
    ];
    const SORTS = [['late', 'Most late first'], ['owed', 'Most owed first'], ['renew', 'Expiring soonest'], ['new', 'Newest joined']];
    const st = this.state;
    const cur = STATUS.find((x) => x[0] === st.status);
    const sortFns = { late: (a, b) => b.late - a.late || a.renew - b.renew, owed: (a, b) => b.bal - a.bal, renew: (a, b) => a.renew - b.renew, new: () => 0 };
    const list = rows0.filter(cur[3]).sort(sortFns[st.sort]);
    const mkOpt = (label, on, dot, count, pick) => ({
      isHead: false, isOpt: true, label, onStr: on ? 'true' : 'false', dot,
      bg: on ? '#F1EEFF' : 'transparent', ink: on ? '#3D27B8' : '#0F172A', weight: on ? '600' : '500',
      count, countBg: count && count !== '✓' ? (on ? '#5B3DF5' : '#F1F3F7') : 'transparent', countInk: on ? (count === '✓' ? '#5B3DF5' : '#FFFFFF') : '#475569', pick,
    });
    const statusItems = STATUS.map((d) => d[0] === 'h'
      ? { isHead: true, isOpt: false, label: d[1] }
      : mkOpt(d[1], st.status === d[0], d[2], String(rows0.filter(d[3]).length), () => this.setState({ status: d[0], sheet: null })));
    const sortItems = SORTS.map(([id, label]) => mkOpt(label, st.sort === id, 'transparent', st.sort === id ? '✓' : '', () => this.setState({ sort: id, sheet: null })));
    const set = st.status !== 'all';
    const rows = list.map((r) => {
      let s;
      if (r.late > 0) s = ['Expired ' + r.late + ' days ago', '#FEF1F0', '#B42318'];
      else if (r.bal > 0) s = ['Due today', '#FFF1E6', '#9A3412'];
      else if (r.renew <= 7) s = [r.renew === 0 ? 'Expires today' : 'Expires in ' + r.renew + ' days', '#FFF6E5', '#92400E'];
      else s = ['Active', '#ECFDF3', '#066B3F'];
      return { ...r, statusText: s[0], pillBg: s[1], pillInk: s[2], initials: r.name.split(' ').map((p) => p[0]).join(''), balText: r.bal > 0 ? '₹' + r.bal.toLocaleString('en-IN') : '—', balInk: r.bal > 0 ? '#B42318' : '#94A3B8' };
    });
    return {
      rows, empty: rows.length === 0,
      stLabel: cur[1] + ' · ' + list.length, stDot: cur[2], stBorder: set ? '#5B3DF5' : '#E2E5EC', stBg: set ? '#F7F5FF' : '#FFFFFF', stInk: set ? '#3D27B8' : '#0F172A',
      sortLabel: SORTS.find((x) => x[0] === st.sort)[1],
      sheetOpen: !!st.sheet, sheetTitle: st.sheet === 'sort' ? 'Sort by' : 'Show members',
      sheetItems: st.sheet === 'sort' ? sortItems : statusItems,
      openStatus: () => this.setState({ sheet: 'status' }), openSort: () => this.setState({ sheet: 'sort' }), close: () => this.setState({ sheet: null }),
    };
  }
}
</script>
</body>
</html>
