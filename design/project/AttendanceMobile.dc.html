<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Attendance – mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:2px solid #5B3DF5;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #F4F6FA; font-family: Inter, system-ui, sans-serif; color: #0F172A">
  <div style="height: 100%; overflow-y: auto; box-sizing: border-box; padding: 18px 16px 24px; display: flex; flex-direction: column; gap: 12px">
    <header><p style="margin: 0; font-size: 12.5px; color: #64748B; font-weight: 500">Today · 14 of 24 in</p><h1 style="margin: 2px 0 0; font-size: 22px; font-weight: 700; letter-spacing: -0.02em">Attendance</h1></header>
    <nav style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px">
      <button type="button" style="height: 64px; border: 0; border-radius: 12px; background: #5B3DF5; color: #FFFFFF; font-weight: 600; font-size: 12.5px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px"><span>✓</span>Check in</button>
      <button type="button" style="height: 64px; border: 1px solid #E2E5EC; border-radius: 12px; background: #FFFFFF; font-weight: 600; font-size: 12.5px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px"><span style="color: #3D27B8">▦</span>Show QR</button>
      <button type="button" style="height: 64px; border: 1px solid #E2E5EC; border-radius: 12px; background: #FFFFFF; font-weight: 600; font-size: 12.5px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px"><span style="color: #475569">↓</span>Import</button>
    </nav>
    <section style="display: flex; gap: 4px; padding: 8px; background: #FFFFFF; border: 1px solid #E7E9F0; border-radius: 14px">
      <sc-for list="{{week}}" as="d" hint-placeholder-count="7">
        <button type="button" onClick="{{d.pick}}" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; border: {{d.border}}; border-radius: 9px; background: {{d.bg}}">
          <span style="font-size: 10.5px; color: {{d.labelInk}}; font-weight: 600">{{d.label}}</span>
          <span style="height: 30px; display: flex; align-items: flex-end"><i style="width: 14px; height: {{d.h}}; border-radius: 4px 4px 1px 1px; background: {{d.bar}}"></i></span>
          <b style="font-size: 12px">{{d.count}}</b>
        </button>
      </sc-for>
    </section>
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; background: #FFFFFF; border: 1px solid #E7E9F0; border-radius: 12px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
        <button type="button" onClick="{{t.pick}}" style="height: 38px; border: 0; border-radius: 9px; background: {{t.bg}}; color: {{t.ink}}; font-size: 12.5px; font-weight: {{t.weight}}">{{t.label}} · {{t.count}}</button>
      </sc-for>
    </div>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
      <article style="background: #FFFFFF; border: 1px solid #E7E9F0; border-radius: 14px; padding: 12px; display: flex; align-items: center; gap: 10px">
        <span style="width: 40px; height: 40px; border-radius: 99px; background: {{r.avBg}}; color: {{r.avInk}}; display: grid; place-items: center; font-weight: 700; font-size: 14px">{{r.short}}</span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><b style="font-size: 14.5px">{{r.name}}</b><span style="font-size: 12px; color: {{r.subInk}}">{{r.sub}}</span></span>
        <button type="button" style="height: 40px; padding: 0 14px; border: {{r.btnBorder}}; border-radius: 10px; background: {{r.btnBg}}; color: {{r.btnInk}}; font-weight: 600; font-size: 13.5px">{{r.btn}}</button>
      </article>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { day: 6, tab: 0 }; }
  renderVals() {
    const st = this.state;
    const W = [['M', 16], ['T', 19], ['W', 15], ['T', 18], ['F', 12], ['S', 9], ['Today', 14]];
    const sets = [
      [
        { name: 'Rohit Kumar', short: 'RK', sub: 'Came 2 days ago · owes ₹3,000', subInk: '#B42318', avBg: '#E8F6FF', avInk: '#0B5E8A' },
        { name: 'Neha Singh', short: 'NS', sub: 'Came yesterday', subInk: '#64748B', avBg: '#FCEEF6', avInk: '#9D1C5E' },
        { name: 'Karan Mehta', short: 'KM', sub: '12 days away', subInk: '#B42318', avBg: '#FFF1E6', avInk: '#9A3412' },
      ].map((r) => ({ ...r, btn: 'Check in', btnBg: '#5B3DF5', btnInk: '#FFFFFF', btnBorder: '0' })),
      [
        { name: 'Aman Gupta', short: 'AG', sub: '6:12 AM · QR', subInk: '#64748B', avBg: '#EEF4FF', avInk: '#1D4ED8' },
        { name: 'Vikram Shah', short: 'VS', sub: '6:30 AM · machine', subInk: '#64748B', avBg: '#F1EEFF', avInk: '#3D27B8' },
      ].map((r) => ({ ...r, btn: 'Undo', btnBg: '#FFFFFF', btnInk: '#475569', btnBorder: '1px solid #E2E5EC' })),
      [
        { name: 'Karan Mehta', short: 'KM', sub: '12 days away', subInk: '#B42318', avBg: '#FFF1E6', avInk: '#9A3412' },
        { name: 'Sunil Rao', short: 'SR', sub: 'Never came · 14 days', subInk: '#B42318', avBg: '#E8F6FF', avInk: '#0B5E8A' },
      ].map((r) => ({ ...r, btn: 'WhatsApp', btnBg: '#F0FBF5', btnInk: '#066B3F', btnBorder: '1px solid #CDEFDD' })),
    ];
    return {
      week: W.map(([label, count], i) => ({ label, count: String(count), h: (count / 19 * 100) + '%', bar: i === st.day ? '#5B3DF5' : '#C7BFFB', border: i === st.day ? '1.5px solid #5B3DF5' : '1px solid transparent', bg: i === st.day ? '#FBFAFF' : 'transparent', labelInk: i === st.day ? '#3D27B8' : '#64748B', pick: () => this.setState({ day: i }) })),
      tabs: [['Not in', '10'], ['In', '14'], ['Away', '5']].map(([label, count], i) => ({ label, count, bg: i === st.tab ? '#F1EEFF' : 'transparent', ink: i === st.tab ? '#3D27B8' : '#475569', weight: i === st.tab ? '600' : '500', pick: () => this.setState({ tab: i }) })),
      rows: sets[st.tab],
    };
  }
}
</script>
</body>
</html>
