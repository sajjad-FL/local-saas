<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Member ledger</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4A2EE6}a:hover{color:#3D27B8}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F6F9; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0F172A; display: flex; flex-direction: column; overflow: hidden">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 16px 12px 8px">
    <a href="Main.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #0F172A">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
    </a>
    <button type="button" aria-label="More actions: edit, pause, mark as left" style="width: 44px; height: 44px; border: 0; background: none; color: #0F172A; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="5" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="12" cy="19" r="1.5"></circle></svg>
    </button>
  </header>

  <section style="padding: 0 20px; display: flex; align-items: center; gap: 14px">
    <span style="width: 52px; height: 52px; border-radius: 99px; background: #F1EEFF; color: #3D27B8; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px">P</span>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <h1 style="margin: 0; font-size: 22px; font-weight: 800">Priya Nair</h1>
      <span style="font-size: 13px; color: #5B6475">Lunch + dinner · ₹3,000 a month</span>
      <span style="font-size: 13px; color: #5B6475">98450 12345 · Since 1 Aug 2026</span>
    </div>
  </section>

  <section aria-label="Balance" style="margin: 18px 20px 0; background: #FFFFFF; border: 1px solid #E8E8EF; border-radius: 16px; padding: 16px">
    <div style="display: flex; justify-content: space-between; align-items: flex-start">
      <div>
        <div style="font-size: 13px; color: #5B6475; font-weight: 600">Owes you</div>
        <div style="font-size: 32px; font-weight: 800; color: #B42318; letter-spacing: -0.02em">₹6,000</div>
        <div style="font-size: 13px; color: #5B6475">October and November unpaid</div>
      </div>
      <span style="font-size: 12px; font-weight: 700; color: #B42318; background: #FEF1F0; border: 1px solid #FBD5D1; padding: 4px 10px; border-radius: 99px">35 days late</span>
    </div>
    <a href="RecordPayment.dc.html" style="margin-top: 14px; height: 48px; border-radius: 12px; background: #5B3DF5; color: #FFFFFF; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5L20 7"></path></svg>
      Record payment
    </a>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 8px">
      <button type="button" style="height: 44px; border-radius: 12px; border: 1px solid #CDEFDD; background: #F0FBF5; color: #066B3F; font-weight: 700; font-size: 14px">Remind on WhatsApp</button>
      <a href="Statement.dc.html" style="height: 44px; border-radius: 12px; border: 1px solid #E4E4EC; background: #FFFFFF; color: #0F172A; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; text-decoration: none">Share statement</a>
    </div>
  </section>

  <section aria-label="Ledger" style="margin: 18px 20px 0; flex: 1; min-height: 0; display: flex; flex-direction: column">
    <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px">
      <h2 style="margin: 0; font-size: 16px; font-weight: 800">History</h2>
      <a href="#" style="font-size: 13px; font-weight: 700; text-decoration: none">Download PDF</a>
    </div>
    <div style="background: #FFFFFF; border: 1px solid #E8E8EF; border-radius: 16px; overflow: hidden">
      <div style="display: grid; grid-template-columns: 1fr 76px 76px; padding: 10px 14px; font-size: 11px; font-weight: 700; color: #5B6475; text-transform: uppercase; letter-spacing: 0.04em; background: #FAFAFC; border-bottom: 1px solid #EEEEF4">
        <span>Entry</span><span style="text-align: right">Amount</span><span style="text-align: right">Balance</span>
      </div>
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
        <div style="display: grid; grid-template-columns: 1fr 76px 76px; align-items: center; padding: 11px 14px; border-bottom: 1px solid #F1F1F5; font-size: 14px">
          <span style="display: flex; flex-direction: column">
            <span style="font-weight: 600">{{r.what}}</span>
            <span style="font-size: 12px; color: #5B6475">{{r.when}}</span>
          </span>
          <span style="text-align: right; font-weight: 700; color: {{r.color}}">{{r.amount}}</span>
          <span style="text-align: right; font-weight: 600; color: #3A4252">{{r.balance}}</span>
        </div>
      </sc-for>
    </div>
  </section>
  <div style="height: 20px"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const rows = [
      { what: 'November fee', when: '1 Nov', amount: '+₹3,000', balance: '₹6,000', color: '#B42318' },
      { what: 'October fee', when: '1 Oct', amount: '+₹3,000', balance: '₹3,000', color: '#B42318' },
      { what: 'Paid · UPI', when: '4 Sep', amount: '−₹3,000', balance: '₹0', color: '#066B3F' },
      { what: 'September fee', when: '1 Sep', amount: '+₹3,000', balance: '₹3,000', color: '#B42318' },
      { what: 'Paid · Cash', when: '2 Aug', amount: '−₹3,000', balance: '₹0', color: '#066B3F' },
    ];
    return { rows };
  }
}
</script>
</body>
</html>
