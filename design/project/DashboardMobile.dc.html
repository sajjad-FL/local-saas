<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dashboard – mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4A2EE6}a:hover{color:#3D27B8}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid #5B3DF5;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F4F6FA; font-family: Inter, system-ui, sans-serif; color: #0F172A; display: flex; flex-direction: column">

  <div style="flex: 1; overflow-y: auto; padding: 18px 16px 96px; display: flex; flex-direction: column; gap: 14px">
    <header style="display: flex; align-items: center; justify-content: space-between">
      <div>
        <p style="margin: 0; font-size: 12.5px; color: #64748B; font-weight: 500">Fri, 20 Nov · KK Fitness</p>
        <h1 style="margin: 2px 0 0; font-size: 22px; font-weight: 700; letter-spacing: -0.02em">Good evening, Sajjad</h1>
      </div>
      <button type="button" aria-label="Add member" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: #5B3DF5; color: #FFFFFF; font-size: 22px; font-weight: 500; display: grid; place-items: center; padding: 0">+</button>
    </header>

    <section aria-label="This month" style="background: #FFFFFF; border: 1px solid #E7E9F0; border-radius: 18px; padding: 16px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <span style="font-size: 13px; font-weight: 600; color: #64748B">Collected in November</span>
        <span style="font-size: 13px; font-weight: 600; color: #066B3F">72%</span>
      </div>
      <div style="display: flex; align-items: baseline; gap: 6px; margin-top: 4px">
        <b style="font-size: 28px; font-weight: 700; letter-spacing: -0.02em">₹38,000</b><span style="font-size: 13px; color: #64748B">of ₹52,500</span>
      </div>
      <div role="img" aria-label="72% collected" style="height: 8px; margin-top: 10px; border-radius: 99px; background: #EEF0F5; overflow: hidden; display: flex"><span style="width: 72%; background: #16A34A"></span></div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 14px; padding-top: 12px; border-top: 1px solid #EEF0F5">
        <a href="#" style="text-decoration: none; color: #0F172A"><span style="display: block; font-size: 12px; color: #B42318; font-weight: 600">To collect</span><b style="font-size: 16px; color: #B42318">₹14,500</b></a>
        <a href="#" style="text-decoration: none; color: #0F172A; padding-left: 12px; border-left: 1px solid #EEF0F5"><span style="display: block; font-size: 12px; color: #64748B; font-weight: 600">Spent</span><b style="font-size: 16px">₹12,000</b></a>
        <a href="#" style="text-decoration: none; color: #0F172A; padding-left: 12px; border-left: 1px solid #EEF0F5"><span style="display: block; font-size: 12px; color: #64748B; font-weight: 600">Profit</span><b style="font-size: 16px; color: #066B3F">₹26,000</b></a>
      </div>
    </section>

    <section aria-labelledby="m-todo" style="background: #FFFFFF; border: 1px solid #E7E9F0; border-radius: 18px">
      <h2 id="m-todo" style="margin: 0; padding: 14px 16px 0; font-size: 16px; font-weight: 700">Follow up today</h2>
      <div role="tablist" aria-label="Who to follow up" style="display: flex; gap: 6px; padding: 10px 12px; overflow-x: auto">
        <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
          <sc-if value="{{t.on}}" hint-placeholder-val="{{ false }}">
            <button type="button" role="tab" aria-selected="true" onClick="{{t.pick}}" style="flex: none; height: 34px; padding: 0 12px; border: 0; border-radius: 99px; background: #0F172A; color: #FFFFFF; font-size: 13px; font-weight: 600">{{t.label}} · {{t.count}}</button>
          </sc-if>
          <sc-if value="{{t.off}}" hint-placeholder-val="{{ true }}">
            <button type="button" role="tab" aria-selected="false" onClick="{{t.pick}}" style="flex: none; height: 34px; padding: 0 12px; border: 1px solid #E2E5EC; border-radius: 99px; background: #FFFFFF; color: #0F172A; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px"><span style="width: 7px; height: 7px; border-radius: 99px; background: {{t.dot}}"></span>{{t.label}} · {{t.count}}</button>
          </sc-if>
        </sc-for>
      </div>
      <ul style="list-style: none; margin: 0; padding: 0 8px 6px">
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
          <li style="display: flex; align-items: center; gap: 10px; padding: 10px 8px; border-top: 1px solid #F0F2F6">
            <span style="width: 36px; height: 36px; flex: none; border-radius: 99px; background: #F1EEFF; color: #3D27B8; display: grid; place-items: center; font-size: 12px; font-weight: 700">{{r.initials}}</span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><b style="font-size: 14px; font-weight: 600">{{r.name}}</b><span style="font-size: 12px; color: {{r.subInk}}; font-weight: 500">{{r.sub}}</span></span>
            <button type="button" style="height: 36px; padding: 0 12px; border: {{r.ctaBorder}}; border-radius: 10px; background: {{r.ctaBg}}; color: {{r.ctaInk}}; font-size: 13px; font-weight: 600; white-space: nowrap">{{r.cta}}</button>
          </li>
        </sc-for>
      </ul>
    </section>

    <section aria-label="Came in today" style="display: flex; align-items: center; gap: 14px; background: #FFFFFF; border: 1px solid #E7E9F0; border-radius: 18px; padding: 14px 16px">
      <svg width="48" height="48" viewBox="0 0 36 36" role="img" aria-label="14 of 24 came in today">
        <circle cx="18" cy="18" r="15.5" fill="none" stroke="#EEF0F5" stroke-width="4"></circle>
        <circle cx="18" cy="18" r="15.5" fill="none" stroke="#5B3DF5" stroke-width="4" stroke-linecap="round" stroke-dasharray="56.8 97.4" transform="rotate(-90 18 18)"></circle>
      </svg>
      <div style="flex: 1"><span style="display: block; font-size: 12.5px; color: #64748B; font-weight: 500">Came in today</span><b style="font-size: 18px">14 <span style="font-size: 13px; color: #64748B; font-weight: 500">of 24</span></b></div>
      <button type="button" style="height: 38px; padding: 0 12px; border: 1px solid #E2E5EC; border-radius: 10px; background: #FFFFFF; color: #0F172A; font-weight: 600; font-size: 13px">Mark</button>
    </section>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #E7E9F0; padding: 6px 8px 18px; font-size: 12px">
    <a href="#" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0; color: #3D27B8; font-weight: 700; text-decoration: none"><span style="width: 22px; height: 4px; border-radius: 99px; background: #5B3DF5"></span>Collect</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0; color: #64748B; font-weight: 600; text-decoration: none"><span style="width: 22px; height: 4px"></span>Members</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0; color: #64748B; font-weight: 600; text-decoration: none"><span style="width: 22px; height: 4px"></span>Attendance</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0; color: #64748B; font-weight: 600; text-decoration: none"><span style="width: 22px; height: 4px"></span>Money</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'late' }; }
  renderVals() {
    const lists = {
      late: [['Rohit Kumar', 'Expired 41 days ago · ₹3,000'], ['Neha Singh', 'Expired 19 days ago · ₹4,000'], ['Sajjad Alam', 'Expired 4 days ago · ₹1,500'], ['Aman Gupta', 'Due today · ₹1,000']],
      soon: [['Pooja Rao', 'Expires tomorrow'], ['Divya Menon', 'Expires in 3 days'], ['Vikram Shah', 'Expires in 6 days']],
      away: [['Karan Mehta', 'Not come for 35 days'], ['Meena Joshi', 'Not come for 12 days'], ['Arjun Das', 'Never came']],
    };
    const meta = {
      late: { label: 'Expired', dot: '#DC2626', cta: 'Collect', ink: '#B42318' },
      soon: { label: 'Expiring', dot: '#D97706', cta: 'Remind', ink: '#92400E' },
      away: { label: 'Not coming', dot: '#7C3AED', cta: 'Call', ink: '#6D28D9' },
    };
    const tab = this.state.tab;
    const m = meta[tab];
    const primary = tab === 'late';
    return {
      tabs: Object.keys(meta).map((id) => ({ label: meta[id].label, dot: meta[id].dot, count: String(lists[id].length), on: id === tab, off: id !== tab, pick: () => this.setState({ tab: id }) })),
      rows: lists[tab].map(([name, sub]) => ({
        name, sub, subInk: m.ink, cta: m.cta, initials: name.split(' ').map((p) => p[0]).join(''),
        ctaBg: primary ? '#5B3DF5' : '#FFFFFF', ctaInk: primary ? '#FFFFFF' : '#0F172A', ctaBorder: primary ? '0' : '1px solid #E2E5EC',
      })),
    };
  }
}
</script>
</body>
</html>
