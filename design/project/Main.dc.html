<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home – who to collect from</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4A2EE6}a:hover{color:#3D27B8}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F6F9; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0F172A; display: flex; flex-direction: column; overflow: hidden">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 12px">
    <button type="button" aria-label="Switch business" style="display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; color: #0F172A">
      <span style="width: 36px; height: 36px; border-radius: 10px; background: #5B3DF5; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px">SM</span>
      <span style="display: flex; flex-direction: column; align-items: flex-start">
        <span style="font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 4px">Sharma Mess
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
        </span>
        <span style="font-size: 12px; color: #5B6475">Thu, 5 Nov</span>
      </span>
    </button>
    <button type="button" aria-label="Add member" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #E4E4EC; background: #FFFFFF; color: #0F172A; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    </button>
  </header>

  <section aria-label="This month" style="margin: 4px 20px 0; background: #FFFFFF; border: 1px solid #E8E8EF; border-radius: 16px; padding: 18px">
    <div style="font-size: 13px; color: #5B6475; font-weight: 600">Still to collect in November</div>
    <div style="display: flex; align-items: baseline; gap: 8px; margin-top: 4px">
      <span style="font-size: 34px; font-weight: 800; letter-spacing: -0.02em">₹14,500</span>
      <span style="font-size: 14px; color: #5B6475">from 5 people</span>
    </div>
    <div style="height: 8px; border-radius: 99px; background: #EEEEF4; margin-top: 14px; overflow: hidden; display: flex">
      <span style="width: 72%; background: {{accent}}"></span>
    </div>
    <div style="display: flex; justify-content: space-between; margin-top: 8px; font-size: 13px">
      <span style="color: #0F172A; font-weight: 600">₹38,000 collected</span>
      <span style="color: #5B6475">of ₹52,500 billed</span>
    </div>
  </section>

  <div role="tablist" aria-label="Filter" style="display: flex; gap: 8px; padding: 18px 20px 10px">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
      <sc-if value="{{t.sel}}" hint-placeholder-val="{{ false }}">
        <button type="button" role="tab" aria-selected="true" onClick="{{t.pick}}" style="height: 36px; padding: 0 14px; border-radius: 99px; font-size: 13px; font-weight: 700; border: 1px solid #0F172A; background: #0F172A; color: #FFFFFF">{{t.label}} · {{t.count}}</button>
      </sc-if>
      <sc-if value="{{t.unsel}}" hint-placeholder-val="{{ true }}">
        <button type="button" role="tab" aria-selected="false" onClick="{{t.pick}}" style="height: 36px; padding: 0 14px; border-radius: 99px; font-size: 13px; font-weight: 700; border: 1px solid #E4E4EC; background: #FFFFFF; color: #0F172A">{{t.label}} · {{t.count}}</button>
      </sc-if>
    </sc-for>
  </div>

  <ul style="list-style: none; margin: 0; padding: 0 20px; display: flex; flex-direction: column; gap: 10px; flex: 1; overflow: auto">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
      <li style="background: #FFFFFF; border: 1px solid #E8E8EF; border-radius: 14px; padding: 14px">
        <a href="Member.dc.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #0F172A">
          <span style="width: 40px; height: 40px; border-radius: 99px; background: #F1EEFF; color: #3D27B8; display: flex; align-items: center; justify-content: center; font-weight: 700; flex: none">{{r.initial}}</span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
            <span style="font-weight: 700; font-size: 15px">{{r.name}}</span>
            <span style="font-size: 13px; color: {{r.metaColor}}">{{r.meta}}</span>
          </span>
          <span style="font-weight: 800; font-size: 16px; color: {{r.amountColor}}">{{r.amount}}</span>
        </a>
        <sc-if value="{{r.owes}}" hint-placeholder-val="{{ true }}">
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 12px">
            <button type="button" style="height: 44px; border-radius: 10px; border: 1px solid #CDEFDD; background: #F0FBF5; color: #066B3F; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 6px">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 0 1-13.3 7.9L3 21l1.1-4.6A9 9 0 1 1 21 12Z"></path></svg>
              Remind
            </button>
            <a href="RecordPayment.dc.html" style="height: 44px; border-radius: 10px; background: {{accent}}; color: #FFFFFF; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5L20 7"></path></svg>
              Got paid
            </a>
          </div>
        </sc-if>
      </li>
    </sc-for>
  </ul>

  <nav aria-label="Main" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #E8E8EF; padding: 6px 8px 18px">
    <a href="Main.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0; font-size: 12px; font-weight: 700; color: {{accent}}; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"></path></svg>Collect</a>
    <a href="Member.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0; font-size: 12px; font-weight: 600; color: #5B6475; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.5A6.5 6.5 0 0 1 21.5 20"></path></svg>Members</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0; font-size: 12px; font-weight: 600; color: #5B6475; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>Money</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0; font-size: 12px; font-weight: 600; color: #5B6475; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="5" cy="12" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="19" cy="12" r="1.5"></circle></svg>More</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5B3DF5","options":["#5B3DF5","#0F766E","#C2410C"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { filter: 'overdue' }; }
  renderVals() {
    const accent = this.props.accent ?? '#5B3DF5';
    const all = [
      { g: 'overdue', name: 'Priya Nair', meta: '2 months unpaid · since 1 Oct', amount: '₹6,000' },
      { g: 'overdue', name: 'Rahul Verma', meta: '1 month unpaid · since 1 Oct', amount: '₹4,000' },
      { g: 'overdue', name: 'Imran Shaikh', meta: 'Part paid · ₹1,500 left', amount: '₹1,500' },
      { g: 'week', name: 'Kavya Iyer', meta: 'Due Sat, 7 Nov', amount: '₹3,000' },
      { g: 'week', name: 'Arjun Das', meta: 'Due Mon, 9 Nov', amount: '₹3,000' },
      { g: 'paid', name: 'Meena Joshi', meta: 'Paid 2 Nov · UPI', amount: '₹3,000' },
      { g: 'paid', name: 'Sanjay Patil', meta: 'Paid 1 Nov · Cash', amount: '₹3,000' },
    ];
    const f = this.state.filter;
    const rows = all.filter((r) => r.g === f).map((r) => ({
      ...r,
      initial: r.name[0],
      owes: r.g !== 'paid',
      amountColor: r.g === 'overdue' ? '#B42318' : r.g === 'paid' ? '#066B3F' : '#0F172A',
      metaColor: r.g === 'overdue' ? '#B42318' : '#5B6475',
    }));
    const defs = [['overdue', 'Overdue', 3], ['week', 'This week', 2], ['paid', 'Paid', 18]];
    const tabs = defs.map(([id, label, count]) => {
      const sel = id === f;
      return { label, count, sel, unsel: !sel, pick: () => this.setState({ filter: id }) };
    });
    return { accent, rows, tabs };
  }
}
</script>
</body>
</html>
