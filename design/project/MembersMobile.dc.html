<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Members – mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4A2EE6}a:hover{color:#3D27B8}
button,input{font:inherit}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{c.bg}}; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: {{c.text}}; display: flex; flex-direction: column; overflow: hidden; position: relative">

  <header style="padding: 20px 20px 10px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div>
        <h1 style="margin: 0; font-size: 24px; font-weight: 800">Members</h1>
        <span style="font-size: 13px; color: {{c.muted}}">KK Fitness · 24 active</span>
      </div>
      <button type="button" aria-label="Import or export" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid {{c.borderStrong}}; background: {{c.surface}}; color: {{c.text}}; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="5" cy="12" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="19" cy="12" r="1.5"></circle></svg>
      </button>
    </div>
    <label style="display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 6px 0 14px; border: 1px solid {{c.borderStrong}}; border-radius: 12px; background: {{c.surface}}; color: {{c.muted}}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search members</span>
      <input type="search" placeholder="Search name or phone" style="border: 0; outline: 0; flex: 1; min-width: 0; font-size: 15px; color: {{c.text}}; background: transparent">
      <button type="button" aria-label="Filter by plan or batch" style="height: 34px; padding: 0 10px; border-radius: 8px; border: 0; background: {{c.surface2}}; color: {{c.text2}}; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 4px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"></path></svg>Filter
      </button>
    </label>
    <div role="tablist" aria-label="Show members" style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -20px; padding: 0 20px 2px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
        <sc-if value="{{t.sel}}" hint-placeholder-val="{{ false }}">
          <button type="button" role="tab" aria-selected="true" onClick="{{t.pick}}" style="flex: none; height: 36px; padding: 0 14px; border-radius: 99px; font-size: 13px; font-weight: 700; border: 1px solid {{c.sel}}; background: {{c.sel}}; color: {{c.selText}}">{{t.label}} · {{t.count}}</button>
        </sc-if>
        <sc-if value="{{t.unsel}}" hint-placeholder-val="{{ true }}">
          <button type="button" role="tab" aria-selected="false" onClick="{{t.pick}}" style="flex: none; height: 36px; padding: 0 14px; border-radius: 99px; font-size: 13px; font-weight: 700; border: 1px solid {{c.borderStrong}}; background: {{c.surface}}; color: {{c.text}}; display: flex; align-items: center; gap: 6px"><span style="width: 7px; height: 7px; border-radius: 99px; background: {{t.dot}}"></span>{{t.label}} · {{t.count}}</button>
        </sc-if>
      </sc-for>
    </div>
  </header>

  <ul style="list-style: none; margin: 0; padding: 2px 20px 150px; display: flex; flex-direction: column; gap: 10px; flex: 1; overflow: auto">
    <sc-if value="{{summary}}" hint-placeholder-val="{{ true }}">
      <li style="display: flex; justify-content: space-between; align-items: center; padding: 2px 2px 0; font-size: 13px; color: {{c.muted}}">
        <span>{{summary}}</span>
        <sc-if value="{{showBulk}}" hint-placeholder-val="{{ true }}">
          <button type="button" style="height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid {{c.greenBorder}}; background: {{c.greenSoft}}; color: {{c.green}}; font-size: 12px; font-weight: 800">Remind all</button>
        </sc-if>
      </li>
    </sc-if>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
      <li style="background: {{c.surface}}; border: 1px solid {{c.border}}; border-radius: 14px; padding: 14px">
        <a href="Member.dc.html" style="display: flex; align-items: flex-start; gap: 12px; color: {{c.text}}; text-decoration: none">
          <span style="width: 42px; height: 42px; border-radius: 99px; background: {{c.accentSoft}}; color: {{c.accentInk}}; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; flex: none">{{r.initials}}</span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
            <span style="font-weight: 700; font-size: 15px">{{r.name}}</span>
            <span style="font-size: 12px; color: {{c.muted}}">{{r.plan}} · {{r.batch}}</span>
          </span>
          <span style="display: flex; flex-direction: column; align-items: flex-end">
            <span style="font-weight: 800; font-size: 16px; color: {{r.balColor}}">{{r.balance}}</span>
          </span>
        </a>
        <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px">
          <span style="font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 99px; background: {{c.surface2}}; color: {{r.renewColor}}">{{r.renewText}}</span>
          <span style="font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 99px; background: {{c.surface2}}; color: {{r.visitColor}}">Visited {{r.visitText}}</span>
        </div>
        <sc-if value="{{r.owes}}" hint-placeholder-val="{{ true }}">
          <div style="display: grid; grid-template-columns: 44px repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 12px">
            <a href="#" aria-label="Call {{r.name}}" style="height: 44px; border-radius: 10px; border: 1px solid {{c.borderStrong}}; color: {{c.text}}; display: flex; align-items: center; justify-content: center">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2Z"></path></svg>
            </a>
            <button type="button" style="height: 44px; border-radius: 10px; border: 1px solid {{c.greenBorder}}; background: {{c.greenSoft}}; color: {{c.green}}; font-weight: 700; font-size: 14px">Remind</button>
            <a href="RecordPayment.dc.html" style="height: 44px; border-radius: 10px; background: {{accent}}; color: #FFFFFF; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; text-decoration: none">Got paid</a>
          </div>
        </sc-if>
        <sc-if value="{{r.away}}" hint-placeholder-val="{{ false }}">
          <div style="display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 8px; margin-top: 12px">
            <a href="#" aria-label="Call {{r.name}}" style="height: 44px; border-radius: 10px; border: 1px solid {{c.borderStrong}}; color: {{c.text}}; display: flex; align-items: center; justify-content: center">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2Z"></path></svg>
            </a>
            <button type="button" style="height: 44px; border-radius: 10px; border: 1px solid {{c.borderStrong}}; background: {{c.surface}}; color: {{c.text}}; font-weight: 700; font-size: 14px">Send a “we miss you” message</button>
          </div>
        </sc-if>
      </li>
    </sc-for>
  </ul>

  <button type="button" aria-label="Add member" style="position: absolute; right: 20px; bottom: 92px; height: 52px; padding: 0 20px; border-radius: 16px; border: 0; background: {{accent}}; color: #FFFFFF; font-weight: 800; font-size: 15px; display: flex; align-items: center; gap: 8px; box-shadow: 0 6px 16px rgba(15, 23, 42, 0.22)">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add member</button>

  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: {{c.surface}}; border-top: 1px solid {{c.border}}; padding: 6px 8px 18px">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0; font-size: 12px; font-weight: 600; color: {{c.muted}}; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"></path></svg>Collect</a>
    <a href="MembersMobile.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0; font-size: 12px; font-weight: 700; color: {{c.accentInk}}; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.5A6.5 6.5 0 0 1 21.5 20"></path></svg>Members</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0; font-size: 12px; font-weight: 600; color: {{c.muted}}; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>Money</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0; font-size: 12px; font-weight: 600; color: {{c.muted}}; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="5" cy="12" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="19" cy="12" r="1.5"></circle></svg>More</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5B3DF5","options":["#5B3DF5","#0F766E","#C2410C","#1D4ED8"]},"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'owes' }; }
  renderVals() {
    const accent = this.props.accent ?? '#5B3DF5';
    const dark = this.props.dark ?? false;
    const c = dark ? {
      bg: '#0B0F17', surface: '#131A26', surface2: '#1B2433', border: '#232D3D', borderStrong: '#2C3748',
      text: '#F1F5F9', text2: '#CBD5E1', muted: '#94A3B8', accentSoft: '#272150', accentInk: '#C9BFFF',
      red: '#F87171', amber: '#FBBF24', green: '#34D399', greenSoft: '#0F2A20', greenBorder: '#1E4D3A', sel: '#F1F5F9', selText: '#0B0F17',
    } : {
      bg: '#F6F6F9', surface: '#FFFFFF', surface2: '#F3F3F8', border: '#E8E8EF', borderStrong: '#E4E4EC',
      text: '#0F172A', text2: '#3A4252', muted: '#5B6475', accentSoft: '#F1EEFF', accentInk: '#3D27B8',
      red: '#B42318', amber: '#B45309', green: '#066B3F', greenSoft: '#F0FBF5', greenBorder: '#CDEFDD', sel: '#0F172A', selText: '#FFFFFF',
    };
    const all = [
      { g: 'owes', name: 'Neha Singh', plan: 'Quarterly', batch: 'Ladies 10–12', renewText: '5 days late', bal: 4000, visit: 9 },
      { g: 'owes', name: 'Rohit Kumar', plan: 'Monthly', batch: 'Morning 6–8', renewText: '12 days late', bal: 3000, visit: 1 },
      { g: 'owes', name: 'Farhan Ali', plan: 'Monthly', batch: 'Evening 6–8', renewText: '2 days late', bal: 1500, visit: 2 },
      { g: 'owes', name: 'Aman Gupta', plan: 'Monthly', batch: 'Evening 6–8', renewText: 'Part paid · ₹500 on 1 Nov', bal: 1000, visit: 0 },
      { g: 'soon', name: 'Sajjad Alam', plan: 'Monthly', batch: 'Morning 6–8', renewText: 'Renews in 3 days', bal: 0, visit: 0 },
      { g: 'soon', name: 'Pooja Rao', plan: 'Monthly', batch: 'Ladies 10–12', renewText: 'Renews in 6 days', bal: 0, visit: 11 },
      { g: 'paid', name: 'Vikram Shah', plan: 'Quarterly', batch: 'Morning 6–8', renewText: 'Renews 27 Dec', bal: 0, visit: 14 },
      { g: 'paid', name: 'Divya Menon', plan: 'Monthly', batch: 'Evening 6–8', renewText: 'Renews 26 Nov', bal: 0, visit: 1 },
    ];
    const tab = this.state.tab;
    const inTab = (r) => tab === 'all' ? true : tab === 'away' ? r.visit >= 7 : tab === 'paid' ? (r.g === 'paid' || r.g === 'soon') : r.g === tab;
    const visitText = (d) => d === 0 ? 'today' : d === 1 ? 'yesterday' : d + ' days ago';
    const rows = all.filter(inTab).map((r) => ({
      ...r,
      initials: r.name.split(' ').map((p) => p[0]).join(''),
      owes: r.bal > 0,
      away: r.bal === 0 && r.visit >= 7,
      balance: r.bal > 0 ? '₹' + r.bal.toLocaleString('en-IN') : 'Paid up',
      balColor: r.bal > 0 ? c.red : c.green,
      renewColor: r.g === 'owes' ? c.red : r.g === 'soon' ? c.amber : c.text2,
      visitText: visitText(r.visit),
      visitColor: r.visit >= 7 ? c.amber : c.text2,
    }));
    const summaries = { owes: '₹9,500 to collect from 4', soon: '₹3,000 coming in this week', away: 'Haven’t come in for 7+ days', paid: '', all: '' };
    const defs = [['owes', 'Owe money', 4, c.red], ['soon', 'Renew this week', 2, c.amber], ['away', 'Not visiting', 3, c.amber], ['paid', 'Paid up', 20, c.green], ['all', 'All', 24, c.muted]];
    const tabs = defs.map(([id, label, count, dot]) => ({
      label, count, dot, sel: id === tab, unsel: id !== tab, pick: () => this.setState({ tab: id }),
    }));
    return { c, accent, tabs, rows, summary: summaries[tab], showBulk: tab === 'owes' };
  }
}
</script>
</body>
</html>
